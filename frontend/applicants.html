<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Applicants - Placement Portal</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .applicants-container {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
      margin-top: 20px;
    }
    .job-selector {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .job-option {
      padding: 12px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .job-option:hover {
      border-color: var(--primary-color);
      background: rgba(102, 157, 246, 0.05);
    }
    .job-option.active {
      border-color: var(--primary-color);
      background: rgba(102, 157, 246, 0.1);
      font-weight: 600;
    }
    .applicants-grid {
      display: grid;
      gap: 12px;
    }
    .applicant-card {
      padding: 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      transition: all 0.2s;
    }
    .applicant-card:hover {
      border-color: var(--primary-color);
      box-shadow: 0 2px 8px rgba(102, 157, 246, 0.1);
    }
    .applicant-header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      margin-bottom: 12px;
    }
    .applicant-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .applicant-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 12px 0;
      padding: 12px 0;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }
    .detail-item {
      display: flex;
      flex-direction: column;
    }
    .detail-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .detail-value {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }
    .applicant-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }
    .status-select {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 14px;
    }
    .filter-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 8px 14px;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover {
      border-color: var(--primary-color);
    }
    .filter-btn.active {
      border-color: var(--primary-color);
      background: var(--primary-color);
      color: white;
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    @media (max-width: 1024px) {
      .applicants-container {
        grid-template-columns: 1fr;
      }
      .applicant-details {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="page-shell">
      <div class="navbar-lite">
        <div class="brand">
          <div class="pill">Company</div>
          <span data-greeting class="pill">Hello</span>
        </div>
        <div class="nav" style="flex-wrap: wrap;">
          <a href="company.html">Dashboard</a>
          <a href="applicants.html" class="active">Manage Applicants</a>
        </div>
        <div class="user-badge">
          <div class="user-avatar" data-user-avatar>C</div>
          <div>
            <div data-user-name>Company</div>
            <div class="minor" data-user-email>email</div>
          </div>
          <button class="btn btn-ghost" data-logout>Logout</button>
        </div>
      </div>

      <section class="stats-row" id="stats-row"></section>

      <section class="applicants-container">
        <!-- Job Selector -->
        <div>
          <div class="section-title"><h3>Jobs</h3></div>
          <div class="job-selector" id="jobs-list"></div>
        </div>

        <!-- Applicants View -->
        <div>
          <div class="section-title">
            <h3 id="applicants-header">Select a job to view applicants</h3>
          </div>

          <div id="applicants-content" style="display: none;">
            <div class="filter-buttons" id="filter-buttons"></div>
            <div class="applicants-grid" id="applicants-grid"></div>
          </div>

          <div id="no-selection" style="text-align: center; padding: 40px;">
            <p class="minor">Select a job from the list to view applicants</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const API_BASE = 'http://localhost:5000/api';

    function getAuth() {
      try {
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        if (!token || !user) return null;
        return { token, user };
      } catch (_) { return null; }
    }

    function showToast(msg, type = 'info') {
      let stack = document.getElementById('toast-stack');
      if (!stack) {
        stack = document.createElement('div');
        stack.id = 'toast-stack';
        stack.className = 'toast-stack';
        document.body.appendChild(stack);
      }
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      stack.appendChild(t);
      setTimeout(() => t.remove(), 4200);
    }

    async function api(path, opts = {}) {
      const auth = getAuth();
      if (!auth) { window.location.href = 'index.html'; return; }
      const isFormData = opts.body instanceof FormData;
      const headers = isFormData ? { ...opts.headers } : { 'Content-Type': 'application/json', ...opts.headers };
      headers.Authorization = `Bearer ${auth.token}`;
      const resp = await fetch(`${API_BASE}${path}`, {
        method: opts.method || 'GET',
        headers,
        body: isFormData ? opts.body : (opts.body ? JSON.stringify(opts.body) : undefined),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    const auth = getAuth();
    if (!auth || auth.user.role_id !== 2) { window.location.href = 'index.html'; }

    document.querySelector('[data-user-name]').textContent = auth.user.email;
    document.querySelector('[data-user-email]').textContent = auth.user.email;
    document.querySelector('[data-user-avatar]').textContent = 'C';

    document.querySelector('[data-logout]')?.addEventListener('click', () => {
      localStorage.clear();
      window.location.href = 'index.html';
    });

    const jobsList = document.querySelector('#jobs-list');
    const applicantsGrid = document.querySelector('#applicants-grid');
    const applicantsHeader = document.querySelector('#applicants-header');
    const applicantsContent = document.querySelector('#applicants-content');
    const noSelection = document.querySelector('#no-selection');
    const filterButtons = document.querySelector('#filter-buttons');
    const statsRow = document.querySelector('#stats-row');

    let jobs = [];
    let currentApplicants = [];
    let currentJobId = null;
    let filterStatus = null;

    // Get job ID from URL parameters if redirected from company dashboard
    const urlParams = new URLSearchParams(window.location.search);
    const redirectedJobId = parseInt(urlParams.get('job')) || null;

    async function loadJobs() {
      try {
        jobs = await api('/company/jobs') || [];
        renderJobsList();
        // If redirected from dashboard, select that job; otherwise select first job
        if (redirectedJobId) {
          selectJob(redirectedJobId);
        } else if (jobs.length > 0) {
          selectJob(jobs[0].id);
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function renderJobsList() {
      jobsList.innerHTML = jobs.map(job => `
        <div class="job-option ${job.id === currentJobId ? 'active' : ''}" data-job-id="${job.id}">
          <div style="font-weight: 600;">${job.title}</div>
          <div class="minor" style="font-size: 12px; margin-top: 4px;">${job.job_type} • ${job.location}</div>
          <div class="minor" style="font-size: 12px; margin-top: 4px;">Deadline: ${new Date(job.application_deadline).toLocaleDateString()}</div>
        </div>
      `).join('');

      document.querySelectorAll('[data-job-id]').forEach(el => {
        el.addEventListener('click', () => selectJob(parseInt(el.getAttribute('data-job-id'))));
      });
    }

    async function selectJob(jobId) {
      currentJobId = jobId;
      filterStatus = null;
      const job = jobs.find(j => j.id === jobId);
      applicantsHeader.textContent = job ? `Applicants for ${job.title}` : `Job #${jobId}`;
      renderJobsList();

      try {
        currentApplicants = await api(`/company/job/${jobId}/applicants`) || [];
        renderStats();
        renderFilterButtons();
        renderApplicants();
        applicantsContent.style.display = 'block';
        noSelection.style.display = 'none';
      } catch (err) {
        applicantsGrid.innerHTML = `<p class="minor">${err.message}</p>`;
        showToast(err.message, 'error');
      }
    }

    function renderStats() {
      const total = currentApplicants.length;
      const applied = currentApplicants.filter(a => a.application_status === 'Applied').length;
      const shortlisted = currentApplicants.filter(a => a.application_status === 'Shortlisted').length;
      const interview = currentApplicants.filter(a => a.application_status === 'Interview').length;
      const selected = currentApplicants.filter(a => a.application_status === 'Selected').length;

      statsRow.innerHTML = `
        <div class="card animate"><p class="minor">Total</p><h2>${total}</h2></div>
        <div class="card animate"><p class="minor">Applied</p><h2>${applied}</h2></div>
        <div class="card animate"><p class="minor">Shortlisted</p><h2>${shortlisted}</h2></div>
        <div class="card animate"><p class="minor">Interview</p><h2>${interview}</h2></div>
        <div class="card animate"><p class="minor">Selected</p><h2>${selected}</h2></div>
      `;
    }

    function renderFilterButtons() {
      const statuses = ['Applied', 'Shortlisted', 'Interview', 'Selected', 'Rejected'];
      filterButtons.innerHTML = `
        <button class="filter-btn active" data-filter="">All</button>
        ${statuses.map(s => `<button class="filter-btn" data-filter="${s}">${s}</button>`).join('')}
      `;

      document.querySelectorAll('[data-filter]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          filterStatus = btn.getAttribute('data-filter') || null;
          renderApplicants();
        });
      });
    }

    function renderApplicants() {
      let filtered = currentApplicants;
      if (filterStatus) {
        filtered = currentApplicants.filter(a => a.application_status === filterStatus);
      }

      applicantsGrid.innerHTML = filtered.length ? filtered.map(app => `
        <div class="applicant-card animate">
          <div class="applicant-header">
            <div>
              <div class="applicant-name">${app.full_name}</div>
              <div class="minor" style="margin-top: 4px;">${app.enrollment_number}</div>
            </div>
            <span class="badge badge-${getStatusColor(app.application_status)}">${app.application_status}</span>
          </div>
          <div class="applicant-details">
            <div class="detail-item">
              <span class="detail-label">Branch</span>
              <span class="detail-value">${app.branch || '—'}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">CGPA</span>
              <span class="detail-value">${app.cgpa || '—'}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Phone</span>
              <span class="detail-value">${app.phone || '—'}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Applied</span>
              <span class="detail-value">${new Date(app.applied_at).toLocaleDateString()}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Skills</span>
              <span class="detail-value">${(app.skills || '—').slice(0, 25)}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">ATS Score</span>
              <span class="detail-value">${app.ats_score ? app.ats_score + '%' : '—'}</span>
            </div>
          </div>
          <div class="applicant-actions">
            <select class="status-select" data-app-id="${app.application_id}" data-app-status>
              <option value="Applied" ${app.application_status === 'Applied' ? 'selected' : ''}>Applied</option>
              <option value="Shortlisted" ${app.application_status === 'Shortlisted' ? 'selected' : ''}>Shortlisted</option>
              <option value="Interview" ${app.application_status === 'Interview' ? 'selected' : ''}>Interview</option>
              <option value="Selected" ${app.application_status === 'Selected' ? 'selected' : ''}>Selected</option>
              <option value="Rejected" ${app.application_status === 'Rejected' ? 'selected' : ''}>Rejected</option>
            </select>
          </div>
        </div>
      `).join('') : '<p class="minor">No applicants found</p>';

      document.querySelectorAll('[data-app-status]').forEach(sel => {
        sel.addEventListener('change', updateStatus);
      });
    }

    async function updateStatus(e) {
      const appId = e.target.getAttribute('data-app-id');
      const newStatus = e.target.value;
      try {
        await api('/company/applicant-status', { method: 'PUT', body: { application_id: appId, status: newStatus } });
        showToast('Status updated', 'success');
        await selectJob(currentJobId);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function getStatusColor(status) {
      switch (status) {
        case 'Applied': return 'blue';
        case 'Shortlisted': return 'amber';
        case 'Interview': return 'purple';
        case 'Selected': return 'green';
        case 'Rejected': return 'red';
        default: return 'gray';
      }
    }

    loadJobs();
  </script>
</body>
</html>
